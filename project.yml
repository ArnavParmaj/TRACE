name: TRACE
options:
  bundleIdPrefix: com.arnavparmaj
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 22JFKH2K5D # free Personal Team
targets:
  TRACE:
    type: application
    platform: iOS
    sources: [TRACE]
    dependencies:
      - target: TRACEWidgets
        embed: true
    scheme:
      testTargets: [TRACETests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arnavparmaj.trace
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: TRACE/Info.plist
      properties:
        CFBundleDisplayName: TRACE
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: TRACE records your route while you ride.
        NSLocationAlwaysAndWhenInUseUsageDescription: TRACE keeps recording your ride when the screen is off or the app is in the background.
        NSMotionUsageDescription: TRACE uses the barometer to measure climb during a ride.
        UIBackgroundModes: [location]
        UIAppFonts: [Oswald.ttf, RobotoCondensed.ttf]
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [trace]
  TRACEWidgets:
    # S18 Live Activity. Local updates only: works on the free Personal Team.
    type: app-extension
    platform: iOS
    sources:
      - TRACEWidgets
      - TRACE/Shared
      - TRACE/Design/Tokens.swift
      - TRACE/Design/Fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arnavparmaj.trace.widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: TRACEWidgets/Info.plist
      properties:
        CFBundleDisplayName: TRACE
        UIAppFonts: [Oswald.ttf, RobotoCondensed.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  TRACETests:
    type: bundle.unit-test
    platform: iOS
    sources: [TRACETests]
    dependencies:
      - target: TRACE
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.arnavparmaj.trace.tests
